name: 🔗 GHA
on: [push, pull_request, merge_group, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

# Fork-local change: this fork targets Windows only, so the Android, iOS, Linux,
# macOS and Web build workflows are not invoked. Their workflow files are left
# untouched, so restoring a platform is a matter of adding its job back here.
#
# Note that dropping the Linux jobs also drops the checks that only ran there:
# the --doctool class reference check, the GDExtension API compatibility check,
# the unit tests, and the project export/converter tests.

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  static-checks:
    if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run the Windows builds.

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/windows_builds.yml
